<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Partner Application Update</title></head>
<body style="margin:0;padding:0;font-family:Arial,sans-serif;background:#f5f5f5;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;">
    <tr><td align="center" style="padding:40px 20px;">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#fff;border-radius:8px;">
        <tr><td align="center" style="padding:30px;"><img src="{{logoUrl}}" alt="Bin Blast Co." width="200" /></td></tr>
        <tr><td style="padding:20px 30px;background:#6b7280;"><h1 style="margin:0;color:#fff;font-size:24px;text-align:center;">Partner application update</h1></td></tr>
        <tr><td style="padding:30px;color:#374151;font-size:16px;line-height:1.6;">
          <p>Hi <strong>{{ownerName}}</strong>,</p>
          <p>Thank you for applying to partner with Bin Blast Co. After review, we're unable to move forward with <strong>{{businessName}}</strong> at this time.</p>
          <p>{{rejectionReason}}</p>
          <p>You're welcome to reapply in the future if your service area or business model changes.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
