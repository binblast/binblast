<!-- Bin Blast shared mobile-optimized email head — paste inside <head> of each template -->
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<style type="text/css">
  body, table, td { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; height: auto; line-height: 100%; max-width: 100%; }
  table { border-collapse: collapse; }
  a { text-decoration: none; }
  @media only screen and (max-width: 620px) {
    .email-outer-pad { padding: 16px 12px !important; }
    .email-container { width: 100% !important; max-width: 100% !important; }
    .email-logo-pad { padding: 24px 20px 16px !important; }
    .email-banner { padding: 16px 20px 20px !important; }
    .email-body { padding: 24px 20px !important; }
    .email-footer { padding: 16px 20px !important; }
    .email-heading { font-size: 22px !important; line-height: 1.3 !important; }
    .email-subheading { font-size: 17px !important; }
    .email-text { font-size: 15px !important; }
    .email-card { padding: 16px !important; margin: 20px 0 !important; }
    .email-logo { max-width: 160px !important; width: 160px !important; }
    .email-btn-wrap { margin: 20px 0 !important; padding: 0 !important; }
    .email-btn {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
      text-align: center !important;
      padding: 16px 20px !important;
      font-size: 16px !important;
      line-height: 1.25 !important;
    }
    .stack-row td {
      display: block !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    .stack-label { padding: 8px 0 2px !important; }
    .stack-value { padding: 0 0 12px !important; }
    .footer-links span { display: block !important; margin: 6px 0 !important; }
    .break-link { font-size: 13px !important; word-break: break-all !important; }
  }
</style>
