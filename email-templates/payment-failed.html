<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Payment Failed</title></head>
<body style="margin:0;padding:0;font-family:Arial,sans-serif;background:#f5f5f5;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;">
    <tr><td align="center" style="padding:40px 20px;">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#fff;border-radius:8px;">
        <tr><td align="center" style="padding:30px;"><img src="{{logoUrl}}" alt="Bin Blast Co." width="200" /></td></tr>
        <tr><td style="padding:20px 30px;background:#dc2626;"><h1 style="margin:0;color:#fff;font-size:24px;text-align:center;">Action needed — update payment</h1></td></tr>
        <tr><td style="padding:30px;color:#374151;font-size:16px;line-height:1.6;">
          <p>Hi <strong>{{firstName}}</strong>,</p>
          <p>We couldn't process your latest payment, so your service is temporarily paused.</p>
          <p><strong>Plan:</strong> {{planName}}<br><strong>Amount due:</strong> {{amountDue}}</p>
          <p style="text-align:center;"><a href="{{dashboardLink}}" style="display:inline-block;padding:14px 28px;background:#dc2626;color:#fff;text-decoration:none;border-radius:8px;font-weight:600;">Update Payment Method</a></p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
